{% extends "base.html" %}

{% block title %}Changer mon mot de passe - Tipikus{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="back-link">← Retour à l'accueil</a>

<h1>🔐 Changer mon mot de passe</h1>
<p style="color: #888; margin-bottom: 30px;">Utilisateur: {{ user.nom }}</p>

<form method="POST" action="{{ url_for('change_password_post') }}" style="max-width: 500px;">
    <div class="form-group">
        <label for="current_password" style="display: block; margin-bottom: 8px; color: #cccccc; font-weight: 500;">
            Mot de passe actuel
        </label>
        <input type="password" name="current_password" id="current_password" required autofocus>
    </div>
    
    <div class="form-group">
        <label for="new_password" style="display: block; margin-bottom: 8px; color: #cccccc; font-weight: 500;">
            Nouveau mot de passe
        </label>
        <input type="password" name="new_password" id="new_password" required minlength="4">
        <small style="color: #888; font-size: 12px; display: block; margin-top: 5px;">
            Au moins 4 caractères
        </small>
    </div>
    
    <div class="form-group">
        <label for="confirm_password" style="display: block; margin-bottom: 8px; color: #cccccc; font-weight: 500;">
            Confirmer le nouveau mot de passe
        </label>
        <input type="password" name="confirm_password" id="confirm_password" required minlength="4">
    </div>
    
    <button type="submit" class="btn">Changer le mot de passe</button>
</form>

<style>
input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 16px;
    background: #2a2a2a;
    color: #e0e0e0;
    transition: border-color 0.3s ease;
}

input[type="password"]:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}
</style>
{% endblock %}
