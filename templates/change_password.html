{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Change Password</h1>

    <form method="POST" action="{{ url_for('auth.change_password_post') }}" class="form-box">
        <div class="form-group">
            <label for="current_password">Current Password:</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>

        <div class="form-group">
            <label for="new_password">New Password:</label>
            <input type="password" id="new_password" name="new_password" required minlength="4">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="4">
        </div>

        <button type="submit" class="btn-primary">Change Password</button>
        <a href="{{ url_for('main.index') }}" class="btn-secondary">Cancel</a>
    </form>
</div>

<style>
.form-box {
    max-width: 500px;
    margin: 2rem auto;
    padding: 2rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 2px 8px var(--shadow);
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: var(--text-primary);
}

.form-group input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border);
    background: var(--bg-primary);
    color: var(--text-primary);
    border-radius: 4px;
    font-size: 1rem;
    transition: border-color 0.2s ease, background 0.3s ease, color 0.3s ease;
}

.form-group input:focus {
    outline: none;
    border-color: var(--accent);
}

.btn-primary, .btn-secondary {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    margin-right: 1rem;
    transition: opacity 0.2s ease, transform 0.1s ease;
}

.btn-primary {
    background: var(--accent);
    color: var(--black);
    font-weight: 600;
}

.btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

.btn-secondary {
    background: var(--text-secondary);
    color: var(--white);
}

.btn-secondary:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}
</style>
{% endblock %}
