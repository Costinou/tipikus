<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tipikus{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            line-height: 1.4;
            padding: 20px;
            min-height: 100vh;
        }
        
        /* Container responsive avec largeurs adaptatives */
        .container {
            max-width: 1400px; /* Augmenté de 600px à 1400px pour desktop */
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }
        
        /* Largeur adaptative selon la taille d'écran */
        @media (min-width: 1600px) {
            .container {
                max-width: 1600px; /* Encore plus large sur très grands écrans */
            }
        }
        
        @media (min-width: 1200px) and (max-width: 1599px) {
            .container {
                max-width: 1400px; /* Large sur grands écrans */
            }
        }
        
        @media (min-width: 768px) and (max-width: 1199px) {
            .container {
                max-width: 1000px; /* Moyen sur tablettes */
            }
        }
        
        @media (max-width: 767px) {
            .container {
                max-width: 100%; /* Pleine largeur sur mobile */
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
                padding: 20px;
            }
            
            body {
                padding: 0;
            }
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
            font-weight: 300;
        }
        
        h2 {
            margin-bottom: 20px;
            color: #cccccc;
            font-weight: 400;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #4a4a4a 0%, #2d2d2d 100%);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(77, 77, 77, 0.4);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            background: #2a2a2a;
            color: #e0e0e0;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus, input[type="file"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .flash-messages {
            margin-bottom: 20px;
        }
        
        .flash {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .flash.success {
            background: #1a3a1a;
            color: #4ade80;
            border: 1px solid #22c55e;
        }
        
        .flash.error {
            background: #3a1a1a;
            color: #f87171;
            border: 1px solid #ef4444;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: #8b9aff;
            text-decoration: underline;
        }
        
        .deck-list {
            list-style: none;
        }
        
        .deck-item {
            margin-bottom: 10px;
        }
        
        /* Grilles responsives pour les cartes */
        .stats-grid,
        .lessons-grid {
            display: grid;
            gap: 15px;
        }
        
        /* Desktop: 4 colonnes */
        @media (min-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .lessons-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        /* Tablette: 3 colonnes */
        @media (min-width: 768px) and (max-width: 1199px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .lessons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        /* Mobile: 2 colonnes */
        @media (max-width: 767px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .lessons-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* Styles pour les pages d'apprentissage (flashcards/quiz) */
        .learning-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }
        
        .learning-body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid #333;
        }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .mode-toggle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .mode-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .counter {
            color: #888;
            font-size: 14px;
            font-weight: 500;
        }
        
        .flashcard-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 20px;
            cursor: pointer;
            user-select: none;
        }
        
        .flashcard {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .flashcard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
        }
        
        .flashcard.revealed {
            background: linear-gradient(135deg, #4a4a4a 0%, #2d2d2d 100%);
            transform: scale(0.98);
            color: #cccccc;
        }
        
        .flashcard:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
        }
        
        .flashcard.revealed:hover {
            transform: scale(0.98) translateY(-3px);
        }
        
        .word-content {
            color: inherit;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            padding: 20px;
            line-height: 1.2;
        }
        
        .instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }
        
        @media (max-width: 768px) {
            .top-bar {
                padding: 10px 15px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .mode-toggle {
                font-size: 12px;
                padding: 6px 12px;
            }
            
            .flashcard-container {
                padding: 70px 15px 15px;
            }
            
            .instruction {
                font-size: 14px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>
    {% if get_flashed_messages() %}
        <div class="flash-messages">
            {% for message in get_flashed_messages() %}
                <div class="flash error">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <script>
    // Synchroniser localStorage avec la session
    (function() {
        // Sur la page de sélection d'utilisateur, ne rien faire
        if (window.location.pathname.includes('/select-user') || 
            window.location.pathname.includes('/create-user')) {
            return;
        }
    })();
    </script>
</body>
</html>
