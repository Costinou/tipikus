{% extends "base.html" %}

{% block title %}{{ langue }} - Tipikus{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="back-link">← Retour aux langues</a>

<h1>{{ langue }}</h1>

{% if decks %}
    <h2>Vos decks</h2>
    <ul class="deck-list">
        {% for deck in decks %}
            <li class="deck-item-wrapper">
                <div class="deck-item-content">
                    <div class="deck-main-buttons">
                        <a href="{{ url_for('apprendre', deck_id=deck.id) }}" class="btn deck-btn">
                            📚 {{ deck.nom }}
                        </a>
                        <a href="{{ url_for('quiz', deck_id=deck.id) }}" class="btn deck-btn btn-quiz">
                            🎯 Quiz
                        </a>
                    </div>
                    <div class="deck-actions">
                        <a href="{{ url_for('voir_deck', deck_id=deck.id) }}" 
                           class="btn-action btn-view" 
                           title="Voir le contenu">
                            👁️
                        </a>
                        <button onclick="confirmerSuppression('{{ deck.nom }}', {{ deck.id }})" 
                                class="btn-action btn-delete" 
                                title="Supprimer le deck">
                            🗑️
                        </button>
                    </div>
                </div>
            </li>
        {% endfor %}
    </ul>
{% endif %}

<a href="{{ url_for('nouveau_deck', langue=langue) }}" class="btn btn-secondary">
    + Nouveau deck
</a>

<style>
.deck-item-wrapper {
    margin-bottom: 15px;
}

.deck-item-content {
    display: flex;
    gap: 8px;
    align-items: stretch;
}

.deck-main-buttons {
    flex: 1;
    display: flex;
    gap: 8px;
}

.deck-btn {
    flex: 1;
    margin: 0;
    font-size: 15px;
}

.btn-quiz {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
}

.btn-quiz:hover {
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
}

.deck-actions {
    display: flex;
    gap: 8px;
}

.btn-action {
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
}

.btn-view {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
}

.btn-view:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
}

.btn-delete {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
}

.btn-delete:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
}

@media (max-width: 600px) {
    .deck-item-content {
        flex-wrap: wrap;
    }
    
    .deck-main-buttons {
        width: 100%;
        gap: 6px;
    }
    
    .deck-btn {
        font-size: 13px;
        padding: 12px 8px;
    }
    
    .btn-action {
        width: 45px;
        height: 45px;
        font-size: 18px;
    }
    
    .deck-actions {
        gap: 6px;
    }
}
</style>

<script>
function confirmerSuppression(nomDeck, deckId) {
    if (confirm(`Êtes-vous sûr de vouloir supprimer le deck "${nomDeck}" ?\n\nCette action est irréversible.`)) {
        // Créer un formulaire pour envoyer la requête POST
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = `/supprimer-deck/${deckId}`;
        document.body.appendChild(form);
        form.submit();
    }
}
</script>
{% endblock %}
