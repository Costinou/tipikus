{% extends "base.html" %}

{% block title %}Apprentissage - Tipikus{% endblock %}

{% block content %}
<div class="learning-container">
    <div class="top-bar">
        <a href="{{ url_for('index') }}" class="back-link">← Retour à l'accueil</a>
        <div class="controls">
            <button id="mode-toggle" class="mode-toggle" onclick="toggleMode()">
                FR → Étranger
            </button>
            <div class="counter">
                Mot <span id="compteur">0</span> sur {{ mots|length }}
            </div>
        </div>
    </div>

    <div class="flashcard-container" onclick="revelerTraduction()">
        <div id="flashcard" class="flashcard">
            <div id="mot-actuel" class="word-content">Cliquez pour commencer</div>
            <button id="btn-audio" class="btn-audio" onclick="prononcerMot(event)" style="display: none;">
                🔊
            </button>
            <div class="instruction">Cliquez ou appuyez sur Espace</div>
        </div>
    </div>
    
    <button id="btn-precedent" class="btn-precedent" onclick="motPrecedent()" disabled>
        ← Précédent
    </button>
</div>

<style>
/* Style spécifique pour annuler le container sur cette page */
body { padding: 0; background: #0f0f0f; }

.btn-precedent {
    position: fixed;
    bottom: 30px;
    left: 30px;
    z-index: 100;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.btn-precedent:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.btn-precedent:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    background: linear-gradient(135deg, #4a4a4a 0%, #2d2d2d 100%);
}

.btn-audio {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 28px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.btn-audio:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.1);
    border-color: rgba(255, 255, 255, 0.5);
}

.btn-audio:active {
    transform: scale(0.95);
}

@media (max-width: 768px) {
    .btn-precedent {
        bottom: 20px;
        left: 20px;
        padding: 10px 16px;
        font-size: 14px;
    }
    
    .btn-audio {
        width: 50px;
        height: 50px;
        font-size: 24px;
        top: 15px;
        right: 15px;
    }
}
</style>

<script>
const mots = {{ mots|tojson }};
let indexActuel = 0;
let traductionVisible = false;
let modeInverse = false; // false = FR→Étranger, true = Étranger→FR
let historique = []; // Historique des indices visités
let motHongroisActuel = ''; // Stocke le mot hongrois à prononcer
let audioElement = null; // Élément audio pour la lecture

function prononcerMot(event) {
    event.stopPropagation(); // Empêcher le clic de se propager à la flashcard
    
    if (!motHongroisActuel) return;
    
    // Arrêter toute lecture en cours
    if (audioElement) {
        audioElement.pause();
        audioElement.currentTime = 0;
    }
    
    // Créer l'URL de notre API TTS
    const texteEncode = encodeURIComponent(motHongroisActuel);
    const url = `/api/tts?text=${texteEncode}`;
    
    // Créer et jouer l'audio
    audioElement = new Audio(url);
    audioElement.play().catch(err => {
        console.error('Erreur de lecture audio:', err);
        alert('Impossible de lire l\'audio. Le serveur TTS n\'est peut-être pas disponible.');
    });
}

function afficherBoutonAudio(afficher, texte = '') {
    const btnAudio = document.getElementById('btn-audio');
    if (afficher) {
        motHongroisActuel = texte;
        btnAudio.style.display = 'flex';
    } else {
        btnAudio.style.display = 'none';
        motHongroisActuel = '';
        // Arrêter la lecture si on cache le bouton
        if (audioElement) {
            audioElement.pause();
        }
    }
}

function toggleMode() {
    modeInverse = !modeInverse;
    const button = document.getElementById('mode-toggle');
    button.textContent = modeInverse ? 'Étranger → FR' : 'FR → Étranger';
    
    // Recommencer avec le nouveau mode
    indexActuel = 0;
    historique = [];
    melangerMots();
    afficherMot();
    updateBoutonPrecedent();
    afficherBoutonAudio(false);
}

function melangerMots() {
    for (let i = mots.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mots[i], mots[j]] = [mots[j], mots[i]];
    }
}

function afficherMot() {
    const flashcard = document.getElementById('flashcard');
    const motActuel = document.getElementById('mot-actuel');
    
    if (indexActuel >= mots.length) {
        motActuel.innerHTML = '🎉<br>Terminé !<br><small>Cliquez pour recommencer</small>';
        flashcard.classList.remove('revealed');
        document.getElementById('compteur').textContent = mots.length;
        afficherBoutonAudio(false);
        return;
    }
    
    const mot = mots[indexActuel];
    const texteAffiche = modeInverse ? mot.traduction : mot.mot_francais;
    
    motActuel.textContent = texteAffiche;
    flashcard.classList.remove('revealed');
    document.getElementById('compteur').textContent = indexActuel + 1;
    traductionVisible = false;
    
    // Cacher le bouton audio quand on affiche la question
    afficherBoutonAudio(false);
}

function revelerTraduction() {
    const flashcard = document.getElementById('flashcard');
    const motActuel = document.getElementById('mot-actuel');
    
    if (indexActuel >= mots.length) {
        // Recommencer
        indexActuel = 0;
        historique = [];
        melangerMots();
        afficherMot();
        updateBoutonPrecedent();
        return;
    }
    
    if (!traductionVisible) {
        // Révéler la traduction
        const mot = mots[indexActuel];
        const traduction = modeInverse ? mot.mot_francais : mot.traduction;
        
        motActuel.textContent = traduction;
        flashcard.classList.add('revealed');
        traductionVisible = true;
        
        // Afficher le bouton audio si c'est du hongrois
        if (!modeInverse) {
            // Mode normal : on affiche le hongrois, donc on peut prononcer
            afficherBoutonAudio(true, traduction);
        } else {
            // Mode inverse : on affiche le français, pas de prononciation
            afficherBoutonAudio(false);
        }
    } else {
        // Passer au mot suivant
        historique.push(indexActuel);
        indexActuel++;
        afficherMot();
        updateBoutonPrecedent();
    }
}

function motPrecedent() {
    if (historique.length > 0) {
        // Récupérer le dernier index de l'historique
        indexActuel = historique.pop();
        afficherMot();
        updateBoutonPrecedent();
        afficherBoutonAudio(false);
    }
}

function updateBoutonPrecedent() {
    const btn = document.getElementById('btn-precedent');
    btn.disabled = historique.length === 0;
}

// Initialiser
melangerMots();
afficherMot();
updateBoutonPrecedent();

// Support des touches clavier
document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        revelerTraduction();
    } else if (e.code === 'KeyM') {
        e.preventDefault();
        toggleMode();
    } else if (e.code === 'ArrowLeft' || e.code === 'Backspace') {
        e.preventDefault();
        motPrecedent();
    } else if (e.code === 'KeyP' && traductionVisible) {
        e.preventDefault();
        prononcerMot(e);
    }
});
</script>
{% endblock %}
