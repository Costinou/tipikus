{% extends "base.html" %}

{% block title %}Apprentissage - Tipikus{% endblock %}

{% block content %}
<div class="learning-container">
    <div class="top-bar">
        <a href="{{ url_for('index') }}" class="back-link">← Retour à l'accueil</a>
        <div class="controls">
            <button id="mode-toggle" class="mode-toggle" onclick="toggleMode()">
                FR → Hongrois
            </button>
            <div class="counter">
                <span id="compteur-appris">0</span> / {{ mots|length }}
                <span style="color: #4ade80; margin-left: 10px;">✓</span>
            </div>
        </div>
    </div>

    <div class="flashcard-container" id="card-container">
        <div id="flashcard" class="flashcard">
            <div id="mot-actuel" class="word-content">Cliquez pour commencer</div>
            <button id="btn-audio" class="btn-audio" onclick="prononcerMot(event)" style="display: none;">
                🔊
            </button>
            
            <!-- Indicateurs de swipe -->
            <div class="swipe-indicator swipe-left" id="swipe-left">
                <div class="swipe-icon">↺</div>
                <div class="swipe-text">Revoir</div>
            </div>
            <div class="swipe-indicator swipe-right" id="swipe-right">
                <div class="swipe-icon">✓</div>
                <div class="swipe-text">Appris</div>
            </div>
            
            <div class="instruction">
                <span id="instruction-text">Cliquez ou Swipe</span>
                <br>
                <small style="opacity: 0.7; font-size: 13px;">← Revoir | Appris →</small>
            </div>
        </div>
    </div>
    
    <!-- Boutons de contrôle en bas -->
    <div class="bottom-controls">
        <button class="control-btn btn-revoir" onclick="marquerRevoir()" title="Revoir ce mot (←)">
            ↺ Revoir
        </button>
        <button class="control-btn btn-appris" onclick="marquerAppris()" title="Mot appris (→)">
            ✓ Appris
        </button>
    </div>
</div>

<style>
/* Style spécifique pour annuler le container sur cette page */
body { padding: 0; background: #0f0f0f; }

.bottom-controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 100;
}

.control-btn {
    padding: 15px 30px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.btn-revoir {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: white;
}

.btn-revoir:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
}

.btn-appris {
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    color: white;
}

.btn-appris:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
}

.btn-audio {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 28px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.btn-audio:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.1);
    border-color: rgba(255, 255, 255, 0.5);
}

.btn-audio:active {
    transform: scale(0.95);
}

/* Indicateurs de swipe */
.swipe-indicator {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    z-index: 5;
}

.swipe-left {
    left: 30px;
    color: #ef4444;
}

.swipe-right {
    right: 30px;
    color: #22c55e;
}

.swipe-indicator.active {
    opacity: 1;
}

.swipe-icon {
    font-size: 48px;
    font-weight: bold;
}

.swipe-text {
    font-size: 18px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Animation de swipe */
.flashcard.swiping-left {
    transform: translateX(-100px) rotate(-10deg);
    opacity: 0.7;
}

.flashcard.swiping-right {
    transform: translateX(100px) rotate(10deg);
    opacity: 0.7;
}

.flashcard.swipe-out-left {
    animation: swipeOutLeft 0.3s ease-out forwards;
}

.flashcard.swipe-out-right {
    animation: swipeOutRight 0.3s ease-out forwards;
}

@keyframes swipeOutLeft {
    to {
        transform: translateX(-150%) rotate(-30deg);
        opacity: 0;
    }
}

@keyframes swipeOutRight {
    to {
        transform: translateX(150%) rotate(30deg);
        opacity: 0;
    }
}

@media (max-width: 768px) {
    .btn-audio {
        width: 50px;
        height: 50px;
        font-size: 24px;
        top: 15px;
        right: 15px;
    }
    
    .bottom-controls {
        bottom: 15px;
        gap: 10px;
    }
    
    .control-btn {
        padding: 12px 24px;
        font-size: 14px;
    }
    
    .swipe-indicator {
        display: none; /* Masquer sur mobile pour ne pas encombrer */
    }
}
</style>

<script>
const mots = {{ mots|tojson }};
const deckId = {{ deck_id }};

let indexActuel = 0;
let traductionVisible = false;
let modeInverse = false; // false = FR→Hongrois, true = Hongrois→FR
let motHongroisActuel = '';
let audioElement = null;

// Gestion du système d'apprentissage
let motsAppris = new Set(); // Mots marqués comme appris
let pileMots = []; // Pile des mots à revoir
let ordreOriginal = []; // Ordre original pour statistiques

// Variables pour le tracking de session
let sessionStartTime = Date.now();
let totalMotsVus = 0;

// Variables pour le swipe
let touchStartX = 0;
let touchStartY = 0;
let currentX = 0;
let currentY = 0;
let isDragging = false;

function prononcerMot(event) {
    event.stopPropagation();
    
    if (!motHongroisActuel) return;
    
    if (audioElement) {
        audioElement.pause();
        audioElement.currentTime = 0;
    }
    
    const texteEncode = encodeURIComponent(motHongroisActuel);
    const url = `/api/tts?text=${texteEncode}`;
    
    audioElement = new Audio(url);
    audioElement.play().catch(err => {
        console.error('Erreur de lecture audio:', err);
        alert('Impossible de lire l\'audio. Le serveur TTS n\'est peut-être pas disponible.');
    });
}

function afficherBoutonAudio(afficher) {
    const btnAudio = document.getElementById('btn-audio');
    if (afficher && motHongroisActuel) {
        btnAudio.style.display = 'flex';
    } else {
        btnAudio.style.display = 'none';
        if (audioElement) {
            audioElement.pause();
        }
    }
}

function toggleMode() {
    modeInverse = !modeInverse;
    const button = document.getElementById('mode-toggle');
    button.textContent = modeInverse ? 'Hongrois → FR' : 'FR → Hongrois';
    
    // Réinitialiser
    initialiserSession();
}

function initialiserSession() {
    motsAppris.clear();
    pileMots = [...Array(mots.length).keys()]; // Indices 0 à mots.length-1
    ordreOriginal = [...pileMots];
    melangerPile();
    indexActuel = 0;
    totalMotsVus = 0;
    afficherMot();
    updateCompteur();
}

function melangerPile() {
    for (let i = pileMots.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pileMots[i], pileMots[j]] = [pileMots[j], pileMots[i]];
    }
}

function afficherMot() {
    const flashcard = document.getElementById('flashcard');
    const motActuel = document.getElementById('mot-actuel');
    
    if (pileMots.length === 0) {
        // Tous les mots sont appris !
        motActuel.innerHTML = '🎉<br>Terminé !<br><small>Tous les mots appris !</small>';
        flashcard.classList.remove('revealed');
        document.getElementById('instruction-text').textContent = 'Félicitations !';
        afficherBoutonAudio(false);
        motHongroisActuel = '';
        
        // Enregistrer la session
        enregistrerSession(true);
        return;
    }
    
    const motIndex = pileMots[indexActuel % pileMots.length];
    const mot = mots[motIndex];
    
    motHongroisActuel = mot.traduction;
    const texteAffiche = modeInverse ? mot.traduction : mot.mot_francais;
    
    motActuel.textContent = texteAffiche;
    flashcard.classList.remove('revealed', 'swiping-left', 'swiping-right');
    traductionVisible = false;
    
    if (modeInverse) {
        afficherBoutonAudio(true);
    } else {
        afficherBoutonAudio(false);
    }
    
    document.getElementById('instruction-text').textContent = 'Cliquez ou Swipe';
}

function revelerTraduction() {
    if (pileMots.length === 0) return;
    
    const flashcard = document.getElementById('flashcard');
    const motActuel = document.getElementById('mot-actuel');
    
    if (!traductionVisible) {
        const motIndex = pileMots[indexActuel % pileMots.length];
        const mot = mots[motIndex];
        const traduction = modeInverse ? mot.mot_francais : mot.traduction;
        
        motActuel.textContent = traduction;
        flashcard.classList.add('revealed');
        traductionVisible = true;
        totalMotsVus++;
        
        afficherBoutonAudio(true);
        document.getElementById('instruction-text').textContent = 'Swipe pour évaluer';
    }
}

function marquerAppris() {
    if (pileMots.length === 0 || !traductionVisible) {
        if (!traductionVisible) {
            revelerTraduction();
        }
        return;
    }
    
    const flashcard = document.getElementById('flashcard');
    const motIndex = pileMots[indexActuel % pileMots.length];
    
    // Animation de swipe vers la droite
    flashcard.classList.add('swipe-out-right');
    
    setTimeout(() => {
        // Marquer comme appris et retirer de la pile
        motsAppris.add(motIndex);
        pileMots.splice(indexActuel % pileMots.length, 1);
        
        // Ajuster l'index si nécessaire
        if (indexActuel >= pileMots.length && pileMots.length > 0) {
            indexActuel = 0;
        }
        
        updateCompteur();
        afficherMot();
    }, 300);
}

function marquerRevoir() {
    if (pileMots.length === 0 || !traductionVisible) {
        if (!traductionVisible) {
            revelerTraduction();
        }
        return;
    }
    
    const flashcard = document.getElementById('flashcard');
    const motIndex = pileMots[indexActuel % pileMots.length];
    
    // Animation de swipe vers la gauche
    flashcard.classList.add('swipe-out-left');
    
    setTimeout(() => {
        // Retirer de la position actuelle
        pileMots.splice(indexActuel % pileMots.length, 1);
        
        // Remettre à la fin de la pile (pour le revoir plus tard)
        pileMots.push(motIndex);
        
        // Ajuster l'index si nécessaire
        if (indexActuel >= pileMots.length && pileMots.length > 0) {
            indexActuel = 0;
        }
        
        afficherMot();
    }, 300);
}

function updateCompteur() {
    document.getElementById('compteur-appris').textContent = motsAppris.size;
}

function enregistrerSession(complete) {
    const dureeSec = Math.floor((Date.now() - sessionStartTime) / 1000);
    
    fetch('/api/session', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            deck_id: deckId,
            type_session: 'flashcard',
            nombre_mots_vus: motsAppris.size, // Nombre de mots appris
            score: 0,
            duree_secondes: dureeSec,
            complete: complete
        })
    }).catch(err => console.error('Erreur enregistrement session:', err));
}

// Enregistrer la session si l'utilisateur quitte la page
window.addEventListener('beforeunload', function() {
    if (motsAppris.size > 0) {
        enregistrerSession(false);
    }
});

// ===== GESTION DU SWIPE =====

const cardContainer = document.getElementById('card-container');
const flashcard = document.getElementById('flashcard');
const swipeLeft = document.getElementById('swipe-left');
const swipeRight = document.getElementById('swipe-right');

// Touch events
flashcard.addEventListener('touchstart', handleTouchStart, { passive: true });
flashcard.addEventListener('touchmove', handleTouchMove, { passive: false });
flashcard.addEventListener('touchend', handleTouchEnd);

// Mouse events (pour desktop)
flashcard.addEventListener('mousedown', handleMouseDown);
document.addEventListener('mousemove', handleMouseMove);
document.addEventListener('mouseup', handleMouseUp);

function handleTouchStart(e) {
    if (!traductionVisible) {
        revelerTraduction();
        return;
    }
    
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    isDragging = true;
}

function handleTouchMove(e) {
    if (!isDragging || !traductionVisible) return;
    
    e.preventDefault();
    
    currentX = e.touches[0].clientX - touchStartX;
    currentY = e.touches[0].clientY - touchStartY;
    
    updateSwipeVisual();
}

function handleTouchEnd(e) {
    if (!isDragging || !traductionVisible) return;
    
    isDragging = false;
    handleSwipeEnd();
}

function handleMouseDown(e) {
    if (!traductionVisible) {
        revelerTraduction();
        return;
    }
    
    touchStartX = e.clientX;
    touchStartY = e.clientY;
    isDragging = true;
    flashcard.style.cursor = 'grabbing';
}

function handleMouseMove(e) {
    if (!isDragging || !traductionVisible) return;
    
    currentX = e.clientX - touchStartX;
    currentY = e.clientY - touchStartY;
    
    updateSwipeVisual();
}

function handleMouseUp(e) {
    if (!isDragging || !traductionVisible) return;
    
    isDragging = false;
    flashcard.style.cursor = 'grab';
    handleSwipeEnd();
}

function updateSwipeVisual() {
    const threshold = 50; // Distance minimale pour activer les indicateurs
    
    // Appliquer la transformation
    flashcard.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.1}deg)`;
    flashcard.style.transition = 'none';
    
    // Afficher les indicateurs
    if (currentX < -threshold) {
        swipeLeft.classList.add('active');
        swipeRight.classList.remove('active');
    } else if (currentX > threshold) {
        swipeRight.classList.add('active');
        swipeLeft.classList.remove('active');
    } else {
        swipeLeft.classList.remove('active');
        swipeRight.classList.remove('active');
    }
}

function handleSwipeEnd() {
    const swipeThreshold = 100; // Distance minimale pour valider le swipe
    
    swipeLeft.classList.remove('active');
    swipeRight.classList.remove('active');
    
    flashcard.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    
    if (currentX < -swipeThreshold) {
        // Swipe vers la gauche - Revoir
        marquerRevoir();
    } else if (currentX > swipeThreshold) {
        // Swipe vers la droite - Appris
        marquerAppris();
    } else {
        // Retour à la position normale
        flashcard.style.transform = '';
    }
    
    currentX = 0;
    currentY = 0;
}

// Initialiser
initialiserSession();

// Support des touches clavier
document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        revelerTraduction();
    } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        marquerAppris();
    } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        marquerRevoir();
    } else if (e.code === 'KeyM') {
        e.preventDefault();
        toggleMode();
    } else if (e.code === 'KeyP') {
        e.preventDefault();
        prononcerMot(e);
    }
});
</script>
{% endblock %}
