<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choisir un utilisateur - Tipikus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            line-height: 1.4;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .user-select-container {
            max-width: 500px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 300;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 14px;
        }
        
        .users-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        .user-item {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        
        .user-form {
            flex: 1;
            margin: 0;
        }
        
        .user-btn {
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            width: 100%;
        }
        
        .user-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-delete-user {
            width: 60px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-delete-user:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
        
        .divider {
            text-align: center;
            color: #666;
            margin: 30px 0;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #333;
        }
        
        .divider::before {
            left: 0;
        }
        
        .divider::after {
            right: 0;
        }
        
        .new-user-section {
            background: #0f0f0f;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }
        
        .new-user-section h3 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 500;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            background: #2a2a2a;
            color: #e0e0e0;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-create {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4a4a4a 0%, #2d2d2d 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(77, 77, 77, 0.4);
        }
        
        .error {
            background: #3a1a1a;
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ef4444;
            font-size: 14px;
        }
        
        .flash-messages {
            margin-bottom: 20px;
        }
        
        .success {
            background: #1a3a1a;
            color: #4ade80;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #22c55e;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            .user-select-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .user-btn {
                font-size: 16px;
                padding: 15px;
            }
            
            .btn-delete-user {
                width: 50px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="user-select-container">
        <h1>👤 Tipikus</h1>
        <p class="subtitle">Choisissez votre profil pour continuer</p>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        {% if get_flashed_messages() %}
        <div class="flash-messages">
            {% for message in get_flashed_messages() %}
                <div class="success">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        
        {% if users %}
        <div class="users-list">
            {% for user in users %}
            <div class="user-item">
                <form method="POST" action="/api/select-user" class="user-form">
                    <input type="hidden" name="user_id" value="{{ user.id }}">
                    <input type="hidden" name="user_name" value="{{ user.nom }}">
                    <button type="submit" class="user-btn">
                        {{ user.nom }}
                    </button>
                </form>
                <button class="btn-delete-user" onclick="confirmerSuppressionUser('{{ user.nom }}', {{ user.id }})" title="Supprimer cet utilisateur">
                    🗑️
                </button>
            </div>
            {% endfor %}
        </div>
        
        <div class="divider">ou</div>
        {% endif %}
        
        <div class="new-user-section">
            <h3>Créer un nouveau profil</h3>
            <form method="POST" action="{{ url_for('create_user_post') }}">
                <div class="form-group">
                    <input type="text" name="nom" placeholder="Votre prénom" required autofocus>
                </div>
                <button type="submit" class="btn-create">Créer</button>
            </form>
        </div>
    </div>
    
    <script>
    function confirmerSuppressionUser(nomUser, userId) {
        if (confirm(`⚠️ ATTENTION !\n\nÊtes-vous sûr de vouloir supprimer l'utilisateur "${nomUser}" ?\n\nCela supprimera DÉFINITIVEMENT :\n• Tous ses decks\n• Tous ses mots\n• Toutes ses statistiques\n\nCette action est IRRÉVERSIBLE.`)) {
            // Créer un formulaire pour envoyer la requête POST
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/delete-user/' + userId;
            document.body.appendChild(form);
            form.submit();
        }
    }
    </script>
</body>
</html>
